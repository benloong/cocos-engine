<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Native 2D Web Boot Probe</title>
  <style>html,body{margin:0;background:#000;color:#0f0;font:12px monospace} #status{padding:4px}</style>
</head>
<body>
  <div id="GameDiv" style="width:320px;height:240px">
    <div id="Cocos3dGameContainer"><canvas id="GameCanvas" width="320" height="240"></canvas></div>
  </div>
  <div id="status">loading</div>
  <script src="/node_modules/systemjs/dist/system.js"></script>
  <script>
    (async function () {
      const status = (s) => { document.getElementById('status').textContent = s; };
      try {
        const root = `${location.origin}/bin/dev/cc/`;
        const cc = await System.import(`${root}base.js`);
        await System.import(`${root}gfx-webgl2.js`);
        await System.import(`${root}legacy-pipeline.js`);
        const cc2d = await System.import(`${root}2d.js`);
        await cc.game.init({ settingsPath: `${location.origin}/native/tests/2d-poc/web/empty-settings.json` });
        window.__cc2dWeb = { cc, cc2d };
        status('BOOT OK');
      } catch (e) {
        status(`ERR ${e && e.stack ? e.stack : e}`);
        throw e;
      }
    })();
  </script>
</body>
</html>
