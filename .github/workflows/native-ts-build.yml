# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: <Native> build-native-ts

on: [pull_request]


# github.head_ref is only defined on pull_request events
concurrency:
  group: ${{ github.workflow }}-${{ github.actor }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: 
      (! contains(github.event.pull_request.body, '[X] does not change any runtime related code or build configuration'))
    strategy:
      matrix:
        node-version: [18.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci --ignore-scripts
    - name: Verify native 2D metadata, shell budgets and runtime imports
      run: |
        node scripts/generate-native-2d-decorators.cjs --check
        node native/tests/2d-poc/check-thin-shell.js
        node --test tests/scripts/native-2d-decorators.test.cjs tests/scripts/native-2d-audit.test.cjs tests/scripts/native-2d-assembler.test.cjs
        node native/tests/2d-poc/audit-m6.cjs --check
    - run: node scripts/spread-pal.cjs
    - run: npm run build:debug-infos
    - name: Download external
      run: |
        EXT_VERSION=`node ./.github/workflows/get-native-external-version.js`
        git clone --branch $EXT_VERSION --depth 1 https://github.com/cocos/cocos-engine-external native/external
    - name: Verify Windows and Web Release feature exports
      run: node native/tests/2d-poc/check-m6-feature-matrix.cjs
    - uses: actions/upload-artifact@v4
      with:
        name: native-2d-release-feature-exports
        path: native/tests/2d-poc/build/feature-matrix/results.json
        if-no-files-found: error
    - name: Compare native RichText parser and layout with Web
      shell: pwsh
      run: |
        ./native/tests/2d-poc/run-m6-richtext-parser-parity.ps1
        ./native/tests/2d-poc/run-m6-richtext-layout-parity.ps1
        ./native/tests/2d-poc/run-m6-graphics-geometry-parity.ps1
    - name: Compare bitmap font layout and radial Sprite geometry with Web
      shell: pwsh
      run: |
        ./native/tests/2d-poc/run-m6-bitmap-layout-parity.ps1
        ./native/tests/2d-poc/run-m6-radial-parity.ps1
    - name: Verify RichText shell and native Node initialization
      run: node node_modules/jest/bin/jest.js --silent --runInBand --runTestsByPath tests/ui/native-2d-m6-richtext-shell.test.ts tests/scene-graph/native-node-constructor.test.ts tests/ui/richtext.test.ts
    - name: Verify font assets and nullable deserialization in both implementations
      run: node node_modules/jest/bin/jest.js --silent --runInBand --runTestsByPath tests/assets/native-font-assets.test.ts tests/assets/native-font-assets-jit.test.ts tests/core/deserialize.test.ts tests/core/deserialize-jit.test.ts tests/ui/font-loader.test.ts tests/asset-manager/factory.test.ts
    - name: Verify native Graphics and Mask lifecycle bridges
      run: node node_modules/jest/bin/jest.js --silent --runInBand --runTestsByPath tests/ui/native-2d-m6-layout-shell.test.ts tests/ui/native-2d-m4-mask-shell.test.ts tests/ui/mask-stencil-lifecycle.test.ts tests/ui/graphics.test.ts tests/ui/native-2d-m1-shell.test.ts tests/ui/native-render-root-lifecycle.test.ts
    - name: Verify native Sprite, SpriteFrame and Label bridges
      run: node node_modules/jest/bin/jest.js --silent --runInBand --runTestsByPath tests/ui/native-2d-m2-sprite-shell.test.ts tests/ui/native-2d-m2-sprite-frame-shell.test.ts tests/ui/native-2d-m3-label-shell.test.ts
    - run: node ./scripts/compile-native-ts.js 
    #- run: echo "::remove-matcher owner=circular-reference-check::"

  windows-2d-runtime:
    name: Windows 2D JSB (${{ matrix.config }})
    runs-on: windows-2022
    if: "!contains(github.event.pull_request.body, '[X] does not change any runtime related code or build configuration')"
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    env:
      BUILD_DIR: ${{ github.workspace }}/native/tests/2d-poc/build/ci-jsb-${{ matrix.config }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18.x
    - run: npm ci --ignore-scripts
    - name: Download native dependencies
      shell: bash
      run: |
        version=$(node .github/workflows/get-native-external-version.js)
        git clone --branch "$version" --depth 1 --filter=blob:none --sparse https://github.com/cocos/cocos-engine-external native/external
        git -C native/external sparse-checkout set cmake sources win64 emscripten
    - run: node scripts/spread-pal.cjs
    - run: npm run build:debug-infos
    - name: Build the engine and JSB test executable
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
        call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
        cmake -S native/tests/2d-poc/native -B "%BUILD_DIR%" -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} || exit /b 1
        cmake --build "%BUILD_DIR%" --target cc2d_native_poc cc2d_ttf_raster --parallel 2
    - name: Run component and scene regressions with generated bindings
      shell: pwsh
      run: ./native/tests/2d-poc/run-windows-jsb-probes.ps1 -Executable "$env:BUILD_DIR/cc2d_native_poc.exe"
    - name: Compare SIMPLE Sprite vertices, UVs and submitted triangles with Web
      id: quad
      shell: pwsh
      run: ./native/tests/2d-poc/run-sprite-quad-parity.ps1 -NativeExecutable "$env:BUILD_DIR/cc2d_native_poc.exe"
    - uses: actions/upload-artifact@v4
      if: "!cancelled() && steps.quad.outcome != 'skipped'"
      with:
        name: sprite-quad-${{ matrix.config }}
        path: |
          native/tests/2d-poc/out/*sprite-quad*
          native/tests/2d-poc/out/web-native-sprite-report.json
    - name: Compare normal and italic shaped text with Windows Chrome
      id: shaping
      shell: pwsh
      run: node native/tests/2d-poc/run-ttf-shaping.cjs "$env:BUILD_DIR/cc2d_ttf_raster.exe"
    - uses: actions/upload-artifact@v4
      if: "!cancelled() && steps.shaping.outcome != 'skipped'"
      with:
        name: ttf-shaping-${{ matrix.config }}
        path: ${{ env.BUILD_DIR }}/ttf-shaping/report.json
    - name: Compare upright synthetic bold stems at fractional origins with Windows Chrome
      id: bold-stem
      if: "!cancelled() && steps.shaping.outcome != 'skipped'"
      shell: pwsh
      run: node native/tests/2d-poc/compare-ttf-origins.cjs --check-bold-stem "$env:BUILD_DIR/cc2d_ttf_raster.exe"
    - uses: actions/upload-artifact@v4
      if: "!cancelled() && steps.bold-stem.outcome != 'skipped'"
      with:
        name: ttf-bold-stem-${{ matrix.config }}
        path: ${{ env.BUILD_DIR }}/ttf-bold-stem/report.json
